services:
  server:
    build:
      context: ./server
    image: file-browser-server
    container_name: file-browser-server
    ports:
      - "9001:9001"
    volumes:
      # The tree the server exposes. Read-only: the server never writes.
      - ./sample-data:/data:ro
    # The task requires the root directory to be given as a startup argument.
    command: ["--root", "/data", "--port", "9001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  client:
    build:
      context: ./client
    image: file-browser-client
    container_name: file-browser-client
    depends_on:
      server:
        condition: service_healthy
    environment:
      - SERVER_URL=http://server:9001
    # Without these two flags input() inside the container reads EOF and the
    # menu exits immediately. Start the client with
    # `docker compose run --rm client`, not `up`: only run attaches a real
    # terminal.
    stdin_open: true
    tty: true
