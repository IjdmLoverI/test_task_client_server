services:
  server:
    build:
      context: ./server
    image: file-browser-server
    container_name: file-browser-server
    ports:
      - "9001:9001"
    volumes:
      # Дерево, которое сервер отдаёт наружу. ro — сервер только читает.
      - ./sample-data:/data:ro
    # Требование ТЗ: корневую директорию задаём параметром при запуске.
    command: ["--root", "/data", "--port", "9001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  client:
    build:
      context: ./client
    image: file-browser-client
    container_name: file-browser-client
    depends_on:
      server:
        condition: service_healthy
    environment:
      - SERVER_URL=http://server:9001
    # Без этих двух флагов input() в контейнере получит EOF и меню упадёт.
    # Запускать клиент нужно через `docker compose run --rm client`,
    # а не `up`: только run подключает терминал по-настоящему.
    stdin_open: true
    tty: true
